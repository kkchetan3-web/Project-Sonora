name: Android build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Java and SDK tools
        run: |
          ./scripts/ci-run.sh java java -version
          ./scripts/ci-run.sh sdk bash -c 'test -n "$ANDROID_HOME" && "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version'
      - name: Install Android SDK 35
        run: ./scripts/ci-run.sh sdk-install "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify Gradle wrapper
        run: ./scripts/ci-run.sh gradle-version ./gradlew --no-daemon --version
      - name: Compile debug
        run: ./scripts/ci-run.sh debug ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Unit tests
        run: ./scripts/ci-run.sh unit ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Compile release
        run: ./scripts/ci-run.sh release ./gradlew --no-daemon --stacktrace :app:assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-logs
          path: |
            ci-logs/
            app/build/reports/tests/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sonora-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          if-no-files-found: warn

  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build instrumentation APKs
        run: ./scripts/ci-run.sh android-test-build ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run Android instrumentation on API 35 x86_64
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./scripts/emulator-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-evidence-${{ github.sha }}
          path: |
            ci-logs/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
